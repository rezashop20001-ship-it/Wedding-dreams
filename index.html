<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital - Section 1 Layering</title>
    <style>
        /* Reset & Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Georgia', serif;
            scroll-behavior: smooth;
            background-color: #f4f4f4;
        }

        /* Container Utama Section 1 */
        .section-cover {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Mengunci elemen agar tidak keluar saat animasi */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Base Layer: Background Paling Belakang */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('file1_background.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* Grouping Semua Elemen Layering (Position Absolute) */
        .layer {
            position: absolute;
            pointer-events: none; /* Supaya tidak menghalangi klik tombol */
            object-fit: contain;
        }

        /* 2. Rumah Adat */
        .img-rumah {
            z-index: 2;
            width: 80%;
            max-width: 500px;
            bottom: 20%;
        }

        /* 3. Bingkai Utama (Menutupi Rumah Adat) */
        .img-bingkai {
            z-index: 3;
            width: 90%;
            max-width: 600px;
            height: 85%;
        }

        /* 4-9. Bunga-Bunga (Di sekeliling bingkai) */
        .bunga { z-index: 4; width: 35%; max-width: 250px; }
        .bunga-ka-ta { top: 0; left: 0; }
        .bunga-ki-ta { top: 0; right: 0; }
        .bunga-ki-te { top: 40%; left: -5%; }
        .bunga-ka-te { top: 40%; right: -5%; }
        .bunga-ki-ba { bottom: 0; left: 0; }
        .bunga-ka-ba { bottom: 0; right: 0; }

        /* 10-11. Daun Selipan */
        .daun { z-index: 5; width: 20%; max-width: 120px; }
        .daun-1 { top: 20%; left: 10%; }
        .daun-2 { bottom: 25%; right: 10%; }

        /* 13. Aksen Bawah */
        .aksen-bawah {
            z-index: 6;
            bottom: 5%;
            width: 50%;
            max-width: 300px;
        }

        /* 12. Logo Inisial (Paling Depan) */
        .logo-inisial {
            position: relative;
            z-index: 10;
            width: 150px;
            margin-top: -150px; /* Posisi menyesuaikan layout */
            animation: fadeInDown 1.5s ease-out;
        }

        /* Tombol Buka Undangan */
        .btn-wrap {
            position: absolute;
            bottom: 12%;
            z-index: 15;
            text-align: center;
        }

        .btn-buka {
            padding: 12px 35px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            background-color: #8d6e63; /* Warna Cokelat Earthy */
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s ease;
        }

        .btn-buka:hover {
            transform: scale(1.1);
            background-color: #6d4c41;
        }

        /* Section 2 (Muncul setelah scroll) */
        .section-content {
            height: 100vh;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Animasi Sederhana */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsif Mobile */
        @media (max-width: 600px) {
            .img-bingkai { width: 95%; height: 80%; }
            .logo-inisial { width: 120px; }
            .bunga { width: 45%; }
        }
    </style>
</head>
<body>

    <audio id="musikUndangan" src="musik_bg.mp3" loop></audio>

    <div class="section-cover">
        <div class="bg-layer"></div>

        <img src="file2_rumah_adat.png" class="layer img-rumah">
        <img src="file3_bingkai_utama.png" class="layer img-bingkai">

        <img src="file4_bunga_kiri_atas.png" class="layer bunga bunga-ka-ta">
        <img src="file5_bunga_kanan_atas.png" class="layer bunga bunga-ki-ta">
        <img src="file6_bunga_kiri_tengah.png" class="layer bunga bunga-ki-te">
        <img src="file7_bunga_kanan_tengah.png" class="layer bunga bunga-ka-te">
        <img src="file8_bunga_kiri_bawah.png" class="layer bunga bunga-ki-ba">
        <img src="file9_bunga_kanan_bawah.png" class="layer bunga bunga-ka-ba">

        <img src="file10_daun_selipan_1.png" class="layer daun daun-1">
        <img src="file11_daun_selipan_2.png" class="layer daun daun-2">

        <img src="file13_aksen_bawah.png" class="layer aksen-bawah">

        <div class="content-center">
            <img src="file12_logo_inisial.png" class="logo-inisial">
        </div>

        <div class="btn-wrap">
            <button class="btn-buka" onclick="bukaUndangan()">Buka Undangan</button>
        </div>
    </div>

    <div id="section2" class="section-content">
        <h2>Konten Undangan Disini</h2>
    </div>

    <script>
        function bukaUndangan() {
            // 1. Putar Musik
            const musik = document.getElementById('musikUndangan');
            musik.play();

            // 2. Scroll ke Section 2
            document.getElementById('section2').scrollIntoView({ 
                behavior: 'smooth' 
            });
        }
    </script>
</body>
</html>
