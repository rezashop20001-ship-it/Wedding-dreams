<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital - Section Cover</title>
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background-color: #f4f4f4;
        }

        /* Container Utama */
        .invitation-container {
            position: relative;
            width: 100%;
            max-width: 500px; /* Standar Mobile View */
            margin: 0 auto;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Section 1: Cover */
        #section-cover {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Sistem Layering Gambar */
        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Menjaga proporsi gambar */
            pointer-events: none; /* Supaya tidak mengganggu klik tombol */
            top: 0;
            left: 0;
        }

        /* Urutan Z-Index (13 Elemen) */
        
        /* 1. Background Paling Belakang */
        .file1 { z-index: 1; object-fit: cover; } 

        /* 2. Rumah Adat */
        .file2 { z-index: 2; transform: scale(0.9); top: 5%; }

        /* 3. Bingkai Utama (Menutup Rumah Adat) */
        .file3 { z-index: 3; }

        /* 4-11. Dekorasi Bunga & Daun */
        .file4 { z-index: 5; } /* Kiri Atas */
        .file5 { z-index: 5; } /* Kanan Atas */
        .file6 { z-index: 5; } /* Kiri Tengah */
        .file7 { z-index: 5; } /* Kanan Tengah */
        .file8 { z-index: 5; } /* Kiri Bawah */
        .file9 { z-index: 5; } /* Kanan Bawah */
        .file10 { z-index: 4; } /* Daun Selipan 1 */
        .file11 { z-index: 4; } /* Daun Selipan 2 */

        /* 12. Logo Inisial (Paling Depan) */
        .file12 { 
            z-index: 10; 
            width: 50%; 
            height: auto; 
            top: 30%; 
            left: 25%; 
            object-fit: contain;
        }

        /* 13. Aksen Bawah */
        .file13 { z-index: 6; }

        /* Area Tombol Buka Undangan */
        .button-wrapper {
            position: absolute;
            bottom: 15%;
            z-index: 15;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: auto; /* Aktifkan klik kembali */
        }

        .btn-open {
            background-color: #8B5E3C; /* Warna cokelat sesuai video */
            color: white;
            padding: 12px 35px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .btn-open:hover {
            transform: scale(1.05);
        }

        /* Section Selanjutnya (Untuk simulasi scroll) */
        #section-content {
            height: 100vh;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
    </style>
</head>
<body>

    <audio id="weddingMusic" loop>
        <source src="musik_undangan.mp3" type="audio/mpeg">
    </audio>

    <div class="invitation-container">
        
        <section id="section-cover">
            <img src="file1_background.jpg" class="layer file1" alt="Background">
            <img src="file2_rumah_adat.png" class="layer file2" alt="Rumah Adat">
            <img src="file3_bingkai_utama.png" class="layer file3" alt="Bingkai">
            
            <img src="file4_bunga_kiri_atas.png" class="layer file4">
            <img src="file5_bunga_kanan_atas.png" class="layer file5">
            <img src="file6_bunga_kiri_tengah.png" class="layer file6">
            <img src="file7_bunga_kanan_tengah.png" class="layer file7">
            <img src="file8_bunga_kiri_bawah.png" class="layer file8">
            <img src="file9_bunga_kanan_bawah.png" class="layer file9">
            
            <img src="file10_daun_selipan_1.png" class="layer file10">
            <img src="file11_daun_selipan_2.png" class="layer file11">
            <img src="file13_aksen_bawah.png" class="layer file13">
            
            <img src="file12_logo_inisial.png" class="layer file12" alt="Logo Pengantin">

            <div class="button-wrapper">
                <button class="btn-open" onclick="openInvitation()">Buka Undangan</button>
            </div>
        </section>

        <section id="section-content">
            <h2>Halaman Isi Undangan</h2>
        </section>

    </div>

    <script>
        function openInvitation() {
            // 1. Play Musik
            const audio = document.getElementById('weddingMusic');
            audio.play().catch(error => {
                console.log("Autoplay dicegah browser, musik akan aktif setelah interaksi.");
            });

            // 2. Scroll ke Section Selanjutnya
            const contentSection = document.getElementById('section-content');
            contentSection.scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
