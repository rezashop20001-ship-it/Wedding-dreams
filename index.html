<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital - Fix Banget</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #f4f4f4;
            font-family: 'Arial', sans-serif;
            scroll-behavior: smooth;
        }

        .cover-section {
            position: relative;
            width: 100%;
            height: 100vh;
            /* GERBANG DISINI: Sisi kiri dan kanan */
            background-image: url('1000318798.png'), url('1000318798.png'), url('file1_background.jpg');
            background-position: left center, right center, center;
            background-repeat: no-repeat, no-repeat, no-repeat;
            background-size: contain, contain, cover;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-frame {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100%;
        }

        .layer {
            position: absolute;
            pointer-events: none;
            object-fit: contain;
        }

        /* RUMAH ADAT (Posisi bawah biar ketutup bunga) */
        .rumah {
            z-index: 2;
            width: 90%;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
        }

        /* BUNGA-BUNGA DENGAN ANIMASI */
        .bunga { z-index: 10; animation: float 5s infinite ease-in-out; }
        .bunga-kecil { z-index: 11; animation: sway 6s infinite ease-in-out; }

        .ki-ta { width: 50%; top: -2%; left: -5%; }
        .ka-ta { width: 50%; top: -2%; right: -5%; transform: scaleX(-1); }
        
        .ki-te { width: 35%; top: 30%; left: 0; }
        .ka-te { width: 35%; top: 30%; right: 0; transform: scaleX(-1); }

        /* BUNGA BAWAH (Gerak juga bep!) */
        .bunga-bawah {
            z-index: 15;
            width: 60%;
            bottom: -5%;
            animation: float 7s infinite ease-in-out;
        }
        .ki-ba { left: -5%; }
        .ka-ba { right: -5%; transform: scaleX(-1); }
        .aksen-ba { z-index: 16; width: 100%; bottom: 0; left: 0; }

        /* LOGO & TOMBOL */
        .center-content {
            position: absolute;
            z-index: 20;
            top: 40%;
            width: 100%;
            text-align: center;
            transform: translateY(-50%);
        }

        .logo {
            width: 60%;
            margin-bottom: 30px;
            animation: pulse 4s infinite ease-in-out;
        }

        .btn-buka {
            background-color: #8D6E63;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* KEYFRAMES */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes sway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(3deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* SECTION ISI (Biar bisa di-scroll) */
        .content-section {
            height: 100vh;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <audio id="lagu" src="musik_bg.mp3" loop></audio>

    <div class="cover-section">
        <div class="main-frame">
            <img src="file2_rumah_adat.png" class="layer rumah">

            <img src="file4_bunga_kiri_atas.png" class="layer bunga ki-ta">
            <img src="file5_bunga_kanan_atas.png" class="layer bunga ka-ta">
            <img src="file6_bunga_kiri_tengah.png" class="layer bunga-kecil ki-te">
            <img src="file7_bunga_kanan_tengah.png" class="layer bunga-kecil ka-te">

            <div class="center-content">
                <img src="file12_logo_inisial.png" class="logo">
                <br>
                <button class="btn-buka" onclick="buka()">Buka Undangan</button>
            </div>

            <img src="file8_bunga_kiri_bawah.png" class="layer bunga-bawah ki-ba">
            <img src="file9_bunga_kanan_bawah.png" class="layer bunga-bawah ka-ba">
            <img src="file13_aksen_bawah.png" class="layer aksen-ba">
        </div>
    </div>

    <div id="targetScroll" class="content-section">
        <h2>Konten Undangan Kamu Di Sini</h2>
    </div>

    <script>
        function buka() {
            document.getElementById('lagu').play();
            document.getElementById('targetScroll').scrollIntoView();
        }
    </script>
</body>
</html>
