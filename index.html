<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital - Section 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Arial', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* Container Section 1 */
        .cover-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-image: url('bg_rumah_adat.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.1);
            z-index: 1;
        }

        /* Styling Bunga & Animasi Gerak */
        .bunga {
            position: absolute;
            z-index: 2;
            width: 40%; 
            max-width: 350px;
            pointer-events: none;
            /* Efek transisi halus */
            transition: all 0.5s ease;
        }

        /* Animasi Mengambang (Floating) untuk bunga atas */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Animasi Goyang Halus (Sway) untuk bunga bawah */
        @keyframes sway {
            0% { transform: translateX(0px) rotate(0deg); }
            50% { transform: translateX(10px) rotate(-2deg); }
            100% { transform: translateX(0px) rotate(0deg); }
        }

        .kiri-atas { 
            top: -10px; left: -10px; 
            animation: float 6s ease-in-out infinite; 
        }
        .kanan-atas { 
            top: -10px; right: -10px; 
            animation: float 7s ease-in-out infinite reverse; 
        }
        .kiri-bawah { 
            bottom: -10px; left: -10px; 
            animation: sway 8s ease-in-out infinite; 
        }
        .kanan-bawah { 
            bottom: -10px; right: -10px; 
            animation: sway 9s ease-in-out infinite reverse; 
        }

        /* Elemen Tengah */
        .content-wrap {
            position: relative;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .logo-tengah {
            width: 220px;
            height: auto;
            filter: drop-shadow(0px 4px 15px rgba(0,0,0,0.2));
            /* Inisial juga bisa dibuat detak jantung halus */
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .btn-buka {
            background-color: #8D6E63;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: 0.4s;
        }

        .btn-buka:hover {
            background-color: #6D4C41;
            transform: scale(1.1);
        }

        .section-dua {
            height: 100vh;
            background: #fdfaf7;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }
    </style>
</head>
<body>

    <audio id="lagu" src="musik_bg.mp3" loop></audio>

    <div class="cover-section">
        <div class="overlay"></div>

        <img src="bunga_kiri_atas.png" class="bunga kiri-atas">
        <img src="bunga_kanan_atas.png" class="bunga kanan-atas">
        <img src="bunga_kiri_bawah.png" class="bunga kiri-bawah">
        <img src="bunga_kanan_bawah.png" class="bunga kanan-bawah">

        <div class="content-wrap">
            <img src="logo_inisial.png" alt="Logo Inisial" class="logo-tengah">
            <button class="btn-buka" onclick="startInvitation()">Buka Undangan</button>
        </div>
    </div>

    <div id="section2" class="section-dua">
        <h2 style="color: #8D6E63;">Konten Undangan Disini</h2>
    </div>

    <script>
        function startInvitation() {
            var audio = document.getElementById("lagu");
            audio.play().catch(function(error) {
                console.log("Browser memblokir audio otomatis");
            });

            document.getElementById("section2").scrollIntoView({ 
                behavior: "smooth" 
            });
        }
    </script>

</body>
</html>
