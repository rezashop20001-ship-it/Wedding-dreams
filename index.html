<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital - 13 Layers Fixed</title>
    <style>
        /* Reset Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
            background-color: #fafafa;
        }

        /* Container Section 1 */
        .cover-wrapper {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Layer 1: Background Utama */
        .bg-base {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('file1_background.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* Grouping Semua Layer Absolute */
        .layer-img {
            position: absolute;
            pointer-events: none;
            object-fit: contain;
        }

        /* --- PERBAIKAN POSISI ELEMEN --- */

        /* Layer 2: Rumah Adat (Di tengah agak bawah) */
        .rumah-adat {
            z-index: 2;
            width: 80%;
            max-width: 450px;
            bottom: 18%; /* Disesuaikan agar pas di tengah bingkai */
            left: 50%;
            transform: translateX(-50%);
        }

        /* Layer 3: Bingkai Utama (Di tengah menutupi rumah) */
        .bingkai-utama {
            z-index: 3;
            width: 90%;
            max-width: 550px;
            height: 85%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Layer 4-9: Bunga-Bunga (Menempel di ujung bingkai) */
        .bunga { z-index: 4; width: 35%; max-width: 220px; }
        
        .bunga-ki-ta { top: 0; left: 0; }
        .bunga-ka-ta { top: 0; right: 0; }
        
        /* Bunga Tengah (Sway animation lembut) */
        .bunga-ki-te { top: 40%; left: -5%; animation: sway 8s infinite ease-in-out; }
        .bunga-ka-te { top: 40%; right: -5%; animation: sway 9s infinite ease-in-out reverse; }
        
        .bunga-ki-ba { bottom: 0; left: 0; }
        .bunga-ka-ba { bottom: 0; right: 0; }

        /* Layer 10-11: Daun Selipan (Di selip-selipan) */
        .daun { z-index: 5; width: 18%; max-width: 120px; }
        .daun-1 { top: 15%; left: 8%; }
        .daun-2 { bottom: 25%; right: 8%; }

        /* Layer 13: Aksen Bawah (Dekat tombol) */
        .aksen-bawah {
            z-index: 6;
            bottom: 5%;
            width: 50%;
            max-width: 300px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Layer 12: Logo Inisial (Tengah atas) */
        .logo-inisial {
            position: relative;
            z-index: 10;
            width: 160px;
            margin-top: -150px; /* Posisi relatif terhadap content center */
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2));
            animation: pulse 4s infinite ease-in-out;
        }

        /* Tombol & Navigasi */
        .btn-container {
            position: absolute;
            bottom: 12%; /* Jarak pas di atas aksen bawah */
            z-index: 15;
            text-align: center;
        }

        .btn-buka {
            padding: 12px 35px;
            background-color: #8D6E63;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .btn-buka:hover {
            background-color: #6D4C41;
            transform: scale(1.05);
        }

        /* Animasi */
        @keyframes sway {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(10px) rotate(-1deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* Section 2 (Isi) */
        .section-dua {
            height: 100vh;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Responsif Mobile */
        @media (max-width: 600px) {
            .logo-inisial { width: 130px; }
            .bunga { width: 40%; max-width: 180px; }
            .rumah-adat { width: 85%; }
            .bingkai-utama { width: 95%; height: 80%; }
        }
    </style>
</head>
<body>

    <audio id="audioBackground" src="musik_bg.mp3" loop></audio>

    <section class="cover-wrapper">
        <div class="bg-base"></div>

        <img src="file2_rumah_adat.png" class="layer-img rumah-adat">
        <img src="file3_bingkai_utama.png" class="layer-img bingkai-utama">

        <img src="file4_bunga_kiri_atas.png" class="layer-img bunga bunga-ki-ta">
        <img src="file5_bunga_kanan_atas.png" class="layer-img bunga bunga-ka-ta">
        <img src="file6_bunga_kiri_tengah.png" class="layer-img bunga bunga-ki-te">
        <img src="file7_bunga_kanan_tengah.png" class="layer-img bunga bunga-ka-te">
        <img src="file8_bunga_kiri_bawah.png" class="layer-img bunga bunga-ki-ba">
        <img src="file9_bunga_kanan_bawah.png" class="layer-img bunga bunga-ka-ba">

        <img src="file10_daun_selipan_1.png" class="layer-img daun daun-1">
        <img src="file11_daun_selipan_2.png" class="layer-img daun daun-2">

        <img src="file13_aksen_bawah.png" class="layer-img aksen-bawah">

        <div class="content-center">
             <img src="file12_logo_inisial.png" class="logo-inisial">
        </div>

        <div class="btn-container">
            <button class="btn-buka" onclick="openInvitation()">Buka Undangan</button>
        </div>
    </section>

    <section id="contentSection" class="section-dua">
        <h2>Konten Undangan Mulai dari Sini</h2>
    </section>

    <script>
        function openInvitation() {
            // Play Musik
            const lagu = document.getElementById('audioBackground');
            lagu.play().catch(e => console.log("Audio play blocked"));

            // Smooth Scroll
            document.getElementById('contentSection').scrollIntoView({ 
                behavior: 'smooth' 
            });
        }
    </script>

</body>
</html>
