<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital - Section 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Arial', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        .cover-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-image: url('bg_rumah_adat.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.1);
            z-index: 1;
        }

        /* --- PERBAIKAN UKURAN BUNGA --- */
        .bunga {
            position: absolute;
            z-index: 2;
            /* Menggunakan width auto agar tidak ter-crop/zoom */
            width: auto; 
            /* Batasi tinggi/lebar maksimal agar pas di layar HP & Desktop */
            max-width: 250px; 
            max-height: 250px;
            pointer-events: none;
            object-fit: contain; /* Memastikan gambar tidak terdistorsi */
        }

        /* Responsif untuk layar HP kecil */
        @media (max-width: 600px) {
            .bunga {
                max-width: 150px;
                max-height: 150px;
            }
        }

        /* Animasi */
        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-5px, -10px) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes sway {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(5px, 5px) rotate(-2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Posisi Presisi di Pojok */
        .kiri-atas { top: 0; left: 0; animation: float 5s ease-in-out infinite; }
        .kanan-atas { top: 0; right: 0; animation: float 6s ease-in-out infinite reverse; }
        .kiri-bawah { bottom: 0; left: 0; animation: sway 7s ease-in-out infinite; }
        .kanan-bawah { bottom: 0; right: 0; animation: sway 8s ease-in-out infinite reverse; }

        /* Konten Tengah */
        .content-wrap {
            position: relative;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .logo-tengah {
            width: 200px;
            height: auto;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.2));
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .btn-buka {
            background-color: #8D6E63;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1.5px;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .btn-buka:hover {
            background-color: #6D4C41;
            transform: translateY(-2px);
        }

        .section-dua {
            height: 100vh;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <audio id="lagu" src="musik_bg.mp3" loop></audio>

    <div class="cover-section">
        <div class="overlay"></div>

        <img src="bunga_kiri_atas.png" class="bunga kiri-atas">
        <img src="bunga_kanan_atas.png" class="bunga kanan-atas">
        <img src="bunga_kiri_bawah.png" class="bunga kiri-bawah">
        <img src="bunga_kanan_bawah.png" class="bunga kanan-bawah">

        <div class="content-wrap">
            <img src="logo_inisial.png" alt="Logo Inisial" class="logo-tengah">
            <button class="btn-buka" onclick="startInvitation()">Buka Undangan</button>
        </div>
    </div>

    <div id="section2" class="section-dua">
        <h2 style="color: #8D6E63;">Isi Undangan Mulai dari Sini</h2>
    </div>

    <script>
        function startInvitation() {
            document.getElementById("lagu").play();
            document.getElementById("section2").scrollIntoView({ behavior: "smooth" });
        }
    </script>

</body>
</html>
