<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital - Section 1</title>
    <style>
        /* Reset Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Arial', sans-serif;
            scroll-behavior: smooth;
        }

        /* Container Section 1 */
        .cover-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Penting agar bunga tidak keluar layar */
            background-image: url('bg_rumah_adat.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Overlay Gelap Transparan */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15); /* Menggelapkan sedikit agar elemen menonjol */
            z-index: 1;
        }

        /* Styling Bunga (Absolute agar ikut tergulung saat scroll) */
        .bunga {
            position: absolute;
            z-index: 2;
            width: 35%; /* Ukuran responsif */
            max-width: 300px;
            pointer-events: none;
        }

        .kiri-atas { top: 0; left: 0; }
        .kanan-atas { top: 0; right: 0; }
        .kiri-bawah { bottom: 0; left: 0; }
        .kanan-bawah { bottom: 0; right: 0; }

        /* Elemen Tengah */
        .content-wrap {
            position: relative;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .logo-tengah {
            width: 180px;
            height: auto;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.3));
        }

        /* Tombol Buka Undangan */
        .btn-buka {
            background-color: #8D6E63; /* Warna Cokelat Earthy */
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1.5px;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .btn-buka:hover {
            background-color: #6D4C41;
            transform: translateY(-3px);
        }

        /* Simulasi Section 2 agar bisa di-scroll */
        .section-dua {
            height: 100vh;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }
    </style>
</head>
<body>

    <audio id="lagu" src="musik_bg.mp3" loop></audio>

    <div class="cover-section">
        <div class="overlay"></div>

        <img src="bunga_kiri_atas.png" class="bunga kiri-atas">
        <img src="bunga_kanan_atas.png" class="bunga kanan-atas">
        <img src="bunga_kiri_bawah.png" class="bunga kiri-bawah">
        <img src="bunga_kanan_bawah.png" class="bunga kanan-bawah">

        <div class="content-wrap">
            <img src="logo_inisial.png" alt="Logo Inisial" class="logo-tengah">
            <button class="btn-buka" onclick="startInvitation()">Buka Undangan</button>
        </div>
    </div>

    <div id="section2" class="section-dua">
        <h1>Konten Undangan Disini</h1>
    </div>

    <script>
        function startInvitation() {
            // Putar Musik
            var audio = document.getElementById("lagu");
            audio.play();

            // Scroll ke Section 2
            document.getElementById("section2").scrollIntoView({ 
                behavior: "smooth" 
            });
        }
    </script>

</body>
</html>
