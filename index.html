<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Digital</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        /* --- CSS STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Playfair Display', serif;
            overflow-x: hidden;
        }

        /* Container Utama (Section 1) */
        .hero-section {
            position: relative;
            height: 100vh;
            width: 100%;
            /* Ganti link di bawah dengan foto rumah adat pilihanmu */
            background: url('https://images.unsplash.com/photo-1590059536259-7f7f85823793?q=80&w=1000') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        /* Overlay Gelap Tipis agar teks terbaca */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1;
        }

        /* Dekorasi Bunga Melayang */
        .decor {
            position: absolute;
            width: 130px; /* Ukuran pas untuk layar HP */
            height: auto;
            z-index: 2;
            pointer-events: none; /* Supaya tidak menghalangi sentuhan jari pada tombol */
            opacity: 0.9;
        }

        .top-left { top: -5px; left: -5px; }
        .top-right { top: -5px; right: -5px; transform: scaleX(-1); }
        .bottom-left { bottom: -5px; left: -5px; transform: scaleY(-1); }
        .bottom-right { bottom: -5px; right: -5px; transform: rotate(180deg); }

        /* Pembungkus Konten Utama */
        .content-wrapper {
            position: relative;
            z-index: 3;
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
        }

        /* Inisial Nama (Atas) */
        .logo-initial {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #f3e5ab; /* Warna emas muda/krem */
            border: 1.5px solid #D2B48C;
            padding: 10px 25px;
            border-radius: 50% 10% 50% 10%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(2px);
        }

        /* Animasi Fade In */
        .fade-in {
            animation: fadeInAnim 2s ease-out forwards;
        }

        /* Nama Pasangan (Tengah) */
        .text-group .subtitle {
            font-size: 0.75rem;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .text-group .couple-name {
            font-size: 2.6rem;
            font-weight: 700;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .text-group .date {
            font-size: 0.9rem;
            font-style: italic;
            letter-spacing: 1px;
        }

        /* Tombol Buka (Bawah) */
        .btn-open {
            display: inline-block;
            padding: 14px 35px;
            background-color: #D2B48C; /* Warna Cokelat Muda */
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: none;
            cursor: pointer;
        }

        .btn-open:active {
            transform: scale(0.95);
            background-color: #b5956d;
        }

        /* Keyframes Animasi */
        @keyframes fadeInAnim {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Penyesuaian untuk layar Tablet/Desktop */
        @media (min-width: 768px) {
            .decor { width: 200px; }
            .text-group .couple-name { font-size: 4.5rem; }
            .logo-initial { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="overlay"></div>

        <img src="https://cdn-icons-png.flaticon.com/512/3505/3505053.png" alt="Flower Decor" class="decor top-left">
        <img src="https://cdn-icons-png.flaticon.com/512/3505/3505053.png" alt="Flower Decor" class="decor top-right">
        <img src="https://cdn-icons-png.flaticon.com/512/3505/3505053.png" alt="Flower Decor" class="decor bottom-left">
        <img src="https://cdn-icons-png.flaticon.com/512/3505/3505053.png" alt="Flower Decor" class="decor bottom-right">

        <div class="content-wrapper">
            <div class="logo-initial fade-in">
                R & A
            </div>

            <div class="text-group fade-in" style="animation-delay: 0.5s;">
                <p class="subtitle">The Wedding of</p>
                <h1 class="couple-name">Romeo &<br>Alana</h1>
                <p class="date">17 . 08 . 2026</p>
            </div>

            <div class="fade-in" style="animation-delay: 1s;">
                <a href="#" class="btn-open">BUKA UNDANGAN</a>
            </div>
        </div>
    </section>

</body>
</html>
