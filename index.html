<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html { 
            height: 100%; 
            font-family: sans-serif; 
            overflow-x: hidden;
            background: #f0f0f0;
        }

        /* Container Section 1 */
        .section-cover {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('file1_background.jpg');
            background-size: cover;
            background-position: center;
        }

        /* FRAME UTAMA (Kunci Proporsi 9:16 seperti layar HP) */
        .main-frame {
            position: relative;
            width: 100%;
            max-width: 500px; /* Lebar maksimal layar HP */
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CSS Layering Universal */
        .layer {
            position: absolute;
            object-fit: contain;
            pointer-events: none;
        }

        /* 3. BINGKAI UTAMA (Patokan Elemen Lain) */
        .file3 {
            z-index: 3;
            width: 90%;
            height: 90%;
            top: 5%;
        }

        /* 2. RUMAH ADAT (Di dalam bingkai, bawahnya agak naik sedikit) */
        .file2 {
            z-index: 2;
            width: 85%;
            bottom: 15%; /* Biar bawahnya nanti ketutup bunga */
        }

        /* 12. LOGO (Tepat di tengah bingkai) */
        .file12 {
            z-index: 10;
            width: 50%;
            top: 35%;
            animation: pulse 4s infinite ease-in-out;
        }

        /* BUNGA-BUNGA SUDUT (Dibuat nempel ke bingkai, bukan ke layar) */
        .file4 { z-index: 5; width: 45%; top: 0; left: 0; } /* Kiri Atas */
        .file5 { z-index: 5; width: 45%; top: 0; right: 0; } /* Kanan Atas */
        
        /* BUNGA TENGAH (Bunga Hijau yang ngegantung tadi) */
        .file6 { z-index: 5; width: 35%; top: 25%; left: 0; } /* Kiri Tengah nempel tepi */
        .file7 { z-index: 5; width: 35%; top: 25%; right: 0; } /* Kanan Tengah nempel tepi */

        /* BUNGA BAWAH (Menutupi bawah rumah adat agar rapi) */
        .file8 { z-index: 12; width: 100%; bottom: 0; left: 0; } /* Kiri Bawah */
        .file9 { z-index: 12; width: 100%; bottom: 0; right: 0; } /* Kanan Bawah */
        
        /* 13. AKSEN BAWAH (Detail tambahan di dasar) */
        .file13 { z-index: 13; width: 100%; bottom: -5%; }

        /* DAUN SELIPAN */
        .file10 { z-index: 4; width: 20%; top: 20%; left: 10%; }
        .file11 { z-index: 4; width: 20%; bottom: 30%; right: 10%; }

        /* TOMBOL BUKA (Tetap di area bawah bingkai) */
        .btn-container {
            position: absolute;
            bottom: 12%;
            z-index: 20;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .btn-buka {
            background-color: #8D6E63;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* Section 2 (Isi) */
        .section-dua { height: 100vh; background: white; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <audio id="musik" src="musik_bg.mp3" loop></audio>

    <section class="section-cover">
        <div class="main-frame">
            <img src="file2_rumah_adat.png" class="layer file2">
            <img src="file3_bingkai_utama.png" class="layer file3">
            
            <img src="file10_daun_selipan_1.png" class="layer file10">
            <img src="file11_daun_selipan_2.png" class="layer file11">

            <img src="file4_bunga_kiri_atas.png" class="layer file4">
            <img src="file5_bunga_kanan_atas.png" class="layer file5">
            <img src="file6_bunga_kiri_tengah.png" class="layer file6">
            <img src="file7_bunga_kanan_tengah.png" class="layer file7">
            
            <img src="file8_bunga_kiri_bawah.png" class="layer file8">
            <img src="file9_bunga_kanan_bawah.png" class="layer file9">
            <img src="file13_aksen_bawah.png" class="layer file13">

            <img src="file12_logo_inisial.png" class="layer file12">

            <div class="btn-container">
                <button class="btn-buka" onclick="buka()">Buka Undangan</button>
            </div>
        </div>
    </section>

    <section id="isi" class="section-dua">
        <h2>Konten Undangan Disini</h2>
    </section>

    <script>
        function buka() {
            document.getElementById('musik').play();
            document.getElementById('isi').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
