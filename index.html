<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital - Pilar Style</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; 
            overflow-x: hidden; 
            background: #d1d1d1;
        }

        .cover-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background-image: url('file1_background.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        /* --- SISTEM PILAR (Kiri & Kanan) --- */
        .side-decor {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%; /* Bagi dua layar */
            display: flex;
            flex-direction: column;
        }

        .left-side { left: 0; align-items: flex-start; }
        .right-side { right: 0; align-items: flex-end; }

        .layer { position: absolute; pointer-events: none; object-fit: contain; }

        /* Bingkai Pilar (file3) - Dibuat nempel ke tepi */
        .bingkai-pilar {
            height: 100%;
            width: auto;
            z-index: 3;
            top: 0;
        }
        .left-side .bingkai-pilar { left: 0; }
        .right-side .bingkai-pilar { right: 0; transform: scaleX(-1); } /* Balik bingkai untuk sisi kanan */

        /* Bunga-Bunga Menyatu dengan Pilar */
        .bunga-pilar { z-index: 5; width: 80%; }
        
        /* Posisi Spesifik Bunga */
        .ki-ta { top: 0; left: 0; }
        .ka-ta { top: 0; right: 0; }
        .ki-te { top: 30%; left: -10%; width: 70%; }
        .ka-te { top: 30%; right: -10%; width: 70%; }
        .ki-ba { bottom: 0; left: 0; width: 100%; z-index: 10; }
        .ka-ba { bottom: 0; right: 0; width: 100%; z-index: 10; }

        /* --- AREA TENGAH --- */
        .center-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .rumah-adat {
            width: 90%;
            bottom: 15%;
            z-index: 2;
        }

        .logo-center {
            width: 60%;
            z-index: 15;
            margin-bottom: 50px;
            animation: pulse 4s infinite ease-in-out;
        }

        /* Tombol & Aksen Bawah */
        .bottom-wrap {
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 12;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .aksen-bawah { width: 100%; position: relative; margin-bottom: -20px; }

        .btn-buka {
            position: relative;
            z-index: 20;
            margin-bottom: 12vh;
            padding: 12px 40px;
            background-color: #8D6E63;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .section-2 { height: 100vh; background: white; }
    </style>
</head>
<body>

    <audio id="musik" src="musik_bg.mp3" loop></audio>

    <div class="cover-container">
        
        <div class="side-decor left-side">
            <img src="1000318798.png" class="layer bingkai-pilar"> <img src="file4_bunga_kiri_atas.png" class="layer bunga-pilar ki-ta">
            <img src="file6_bunga_kiri_tengah.png" class="layer bunga-pilar ki-te">
            <img src="file8_bunga_kiri_bawah.png" class="layer bunga-pilar ki-ba">
        </div>

        <div class="center-content">
            <img src="file2_rumah_adat.png" class="layer rumah-adat">
            <img src="file12_logo_inisial.png" class="layer logo-center">
            
            <div class="bottom-wrap">
                <button class="btn-buka" onclick="start()">Buka Undangan</button>
                <img src="file13_aksen_bawah.png" class="aksen-bawah">
            </div>
        </div>

        <div class="side-decor right-side">
            <img src="1000318798.png" class="layer bingkai-pilar">
            <img src="file5_bunga_kanan_atas.png" class="layer bunga-pilar ka-ta">
            <img src="file7_bunga_kanan_tengah.png" class="layer bunga-pilar ka-te">
            <img src="file9_bunga_kanan_bawah.png" class="layer bunga-pilar ka-ba">
        </div>

    </div>

    <section id="isi" class="section-2"></section>

    <script>
        function start() {
            document.getElementById('musik').play();
            document.getElementById('isi').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
