<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital - 13 Layers Cover</title>
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
            background-color: #fafafa;
        }

        /* Container Section 1 */
        .cover-wrapper {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Layer 1: Background Utama */
        .bg-base {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('file1_background.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* Grouping Semua Layer Absolute */
        .layer-img {
            position: absolute;
            pointer-events: none;
            object-fit: contain;
            transition: all 0.5s ease;
        }

        /* Layer 2: Rumah Adat */
        .rumah-adat {
            z-index: 2;
            width: 75%;
            max-width: 450px;
            bottom: 22%;
        }

        /* Layer 3: Bingkai Utama (Menutup Rumah Adat) */
        .bingkai-utama {
            z-index: 3;
            width: 90%;
            max-width: 550px;
            height: 80%;
        }

        /* Layer 4-9: Bunga-Bunga (Z-index 4 agar di depan bingkai) */
        .bunga { z-index: 4; width: 40%; max-width: 280px; }
        .bunga-ki-ta { top: -20px; left: -20px; animation: float 6s infinite ease-in-out; }
        .bunga-ka-ta { top: -20px; right: -20px; animation: float 7s infinite ease-in-out reverse; }
        .bunga-ki-te { top: 35%; left: -10%; animation: sway 8s infinite ease-in-out; }
        .bunga-ka-te { top: 35%; right: -10%; animation: sway 9s infinite ease-in-out reverse; }
        .bunga-ki-ba { bottom: -10px; left: -10px; animation: sway 10s infinite ease-in-out; }
        .bunga-ka-ba { bottom: -10px; right: -10px; animation: sway 11s infinite ease-in-out reverse; }

        /* Layer 10-11: Daun Selipan (Z-index 5) */
        .daun { z-index: 5; width: 25%; max-width: 150px; }
        .daun-1 { top: 15%; left: 5%; }
        .daun-2 { bottom: 20%; right: 5%; }

        /* Layer 13: Aksen Bawah (Dekat tombol) */
        .aksen-bawah {
            z-index: 6;
            bottom: 2%;
            width: 60%;
            max-width: 350px;
        }

        /* Layer 12: Logo Inisial (Paling depan) */
        .logo-inisial {
            position: relative;
            z-index: 10;
            width: 180px;
            margin-top: -120px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
            animation: pulse 4s infinite ease-in-out;
        }

        /* Tombol & Navigasi */
        .btn-container {
            position: absolute;
            bottom: 10%;
            z-index: 15;
            text-align: center;
        }

        .btn-buka {
            padding: 14px 40px;
            background-color: #8D6E63;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .btn-buka:hover {
            background-color: #6D4C41;
            transform: scale(1.1);
        }

        /* Animasi */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        @keyframes sway {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(10px) rotate(-2deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Section 2 (Isi) */
        .section-dua {
            height: 100vh;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Responsif Mobile */
        @media (max-width: 600px) {
            .logo-inisial { width: 140px; }
            .bunga { width: 45%; }
            .rumah-adat { width: 85%; }
        }
    </style>
</head>
<body>

    <audio id="audioBackground" src="musik_bg.mp3" loop></audio>

    <section class="cover-wrapper">
        <div class="bg-base"></div>

        <img src="file2_rumah_adat.png" class="layer-img rumah-adat">
        <img src="file3_bingkai_utama.png" class="layer-img bingkai-utama">

        <img src="file4_bunga_kiri_atas.png" class="layer-img bunga bunga-ki-ta">
        <img src="file5_bunga_kanan_atas.png" class="layer-img bunga bunga-ka-ta">
        <img src="file6_bunga_kiri_tengah.png" class="layer-img bunga bunga-ki-te">
        <img src="file7_bunga_kanan_tengah.png" class="layer-img bunga bunga-ka-te">
        <img src="file8_bunga_kiri_bawah.png" class="layer-img bunga bunga-ki-ba">
        <img src="file9_bunga_kanan_bawah.png" class="layer-img bunga bunga-ka-ba">

        <img src="file10_daun_selipan_1.png" class="layer-img daun daun-1">
        <img src="file11_daun_selipan_2.png" class="layer-img daun daun-2">

        <img src="file13_aksen_bawah.png" class="layer-img aksen-bawah">

        <img src="file12_logo_inisial.png" class="layer-img logo-inisial">

        <div class="btn-container">
            <button class="btn-buka" onclick="openInvitation()">Buka Undangan</button>
        </div>
    </section>

    <section id="contentSection" class="section-dua">
        <h2>Konten Undangan Selanjutnya</h2>
    </section>

    <script>
        function openInvitation() {
            // Play Musik
            const lagu = document.getElementById('audioBackground');
            lagu.play().catch(e => console.log("Audio play blocked"));

            // Smooth Scroll
            document.getElementById('contentSection').scrollIntoView({ 
                behavior: 'smooth' 
            });
        }
    </script>

</body>
</html>
