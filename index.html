<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital Eja</title>
    <style>
        /* Reset & Base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #fafafa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Container Utama */
        .section-cover {
            position: relative;
            width: 100%;
            height: 100vh;
            background-image: url('file1_background.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Memotong bunga yang keluar jalur agar tidak muncul scrollbar */
            overflow: hidden; 
        }

        /* Frame 9:16 (Simulasi Layar HP) */
        .main-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            justify-content: center;
        }

        .layer {
            position: absolute;
            pointer-events: none;
            object-fit: contain;
        }

        /* --- PILAR (STABIL) --- */
        .gate-pilar {
            z-index: 5;
            height: 100%;
            width: auto;
            top: 0;
        }
        .gate-left { left: 0; }
        .gate-right { right: 0; transform: scaleX(-1); }

        /* --- RUMAH ADAT --- */
        .rumah-adat {
            z-index: 2;
            width: 85%;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
        }

        /* --- ANIMASI HALUS (ANTI PATAH) --- */
        
        /* Goyang Halus */
        @keyframes flowerSway {
            0%, 100% { transform: scale(1.1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(3deg); }
        }

        /* Melayang Halus */
        @keyframes flowerFloat {
            0%, 100% { transform: scale(1.1) translateY(0); }
            50% { transform: scale(1.1) translateY(-10px); }
        }

        /* Logo Berdenyut */
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* --- PENEMPATAN BUNGA --- 
           Catatan: Pakai nilai minus (negatif) di top/left/right 
           supaya bagian foto yang rata tersembunyi di balik layar.
        */

        .ki-ta { 
            z-index: 10; width: 60%; top: -5%; left: -10%; 
            transform-origin: top left; 
            animation: flowerSway 7s infinite ease-in-out; 
        }
        .ka-ta { 
            z-index: 10; width: 60%; top: -5%; right: -10%; 
            transform-origin: top right; 
            animation: flowerSway 8s infinite ease-in-out reverse; 
        }
        
        .ki-te { 
            z-index: 10; width: 40%; top: 30%; left: -8%; 
            animation: flowerFloat 6s infinite ease-in-out; 
        }
        .ka-te { 
            z-index: 10; width: 40%; top: 35%; right: -8%; 
            animation: flowerFloat 9s infinite ease-in-out reverse; 
        }

        .bunga-bawah { 
            z-index: 15; width: 75%; bottom: -5%; 
        }
        .ki-ba { 
            left: -12%; 
            transform-origin: bottom left; 
            animation: flowerSway 10s infinite ease-in-out; 
        }
        .ka-ba { 
            right: -12%; 
            transform-origin: bottom right; 
            animation: flowerSway 9s infinite ease-in-out reverse; 
        }
        
        .aksen-ba { 
            z-index: 16; width: 110%; bottom: -4%; left: -5%; 
            animation: flowerFloat 5s infinite ease-in-out; 
        }

        /* --- TENGAH --- */
        .center-area {
            position: absolute;
            z-index: 20;
            top: 45%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(-50%);
        }

        .logo-inisial {
            width: 55%;
            margin-bottom: 40px;
            animation: logoPulse 4s infinite ease-in-out;
        }

        .btn-buka {
            padding: 15px 45px;
            background: #8D6E63;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .btn-buka:hover { transform: scale(1.1); background-color: #6D4C41; }

        .section-content {
            min-height: 100vh;
            background: #fff;
            padding: 100px 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <audio id="undanganAudio" src="musik_bg.mp3" loop></audio>

    <section class="section-cover">
        <div class="main-wrapper">
            
            <img src="file2_rumah_adat.png" class="layer rumah-adat">

            <img src="1000318798.png" class="layer gate-pilar gate-left">
            <img src="1000318798.png" class="layer gate-pilar gate-right">

            <img src="file4_bunga_kiri_atas.png" class="layer ki-ta">
            <img src="file5_bunga_kanan_atas.png" class="layer ka-ta">
            <img src="file6_bunga_kiri_tengah.png" class="layer ki-te">
            <img src="file7_bunga_kanan_tengah.png" class="layer ka-te">

            <div class="center-area">
                <img src="file12_logo_inisial.png" class="logo-inisial">
                <button class="btn-buka" onclick="bukaUndangan()">Buka Undangan</button>
            </div>

            <img src="file8_bunga_kiri_bawah.png" class="layer bunga-bawah ki-ba">
            <img src="file9_bunga_kanan_bawah.png" class="layer bunga-bawah ka-ba">
            <img src="file13_aksen_bawah.png" class="layer aksen-ba">

        </div>
    </section>

    <section id="konten" class="section-content">
        <h2>Selamat Datang di Undangan Kami</h2>
        <p style="margin-top:20px;">Kebahagiaan adalah saat kami bisa berbagi momen ini dengan Anda.</p>
    </section>

    <script>
        function bukaUndangan() {
            var audio = document.getElementById("undanganAudio");
            audio.play().catch(function(error) {
                console.log("Musik butuh interaksi user.");
            });

            document.getElementById('konten').scrollIntoView({ 
                behavior: 'smooth' 
            });
        }
    </script>
</body>
</html>
