<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital Eja - Full Motion</title>
    <style>
        /* Reset & Base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #fafafa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Container Section 1 */
        .section-cover {
            position: relative;
            width: 100%;
            height: 100vh;
            background-image: url('file1_background.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Frame Utama (Ukuran 9:16) */
        .main-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            justify-content: center;
        }

        .layer {
            position: absolute;
            pointer-events: none;
            object-fit: contain;
        }

        /* --- GERBANG (Kiri & Kanan) --- */
        .gate-pilar {
            z-index: 3;
            height: 100%;
            width: auto;
            top: 0;
        }
        .gate-left { left: 0; }
        .gate-right { right: 0; transform: scaleX(-1); }

        /* --- RUMAH ADAT (Tenggelam di bawah) --- */
        .rumah-adat {
            z-index: 2;
            width: 90%;
            bottom: 12%; /* Dibuat rendah agar tertutup bunga */
            left: 50%;
            transform: translateX(-50%);
        }

        /* --- SEMUA BUNGA WAJIB GERAK --- */
        
        /* Animasi 1: Floating (Naik Turun) */
        @keyframes flowerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Animasi 2: Sway (Goyang Kiri Kanan) */
        @keyframes flowerSway {
            0%, 100% { transform: rotate(0deg) translateX(0); }
            50% { transform: rotate(3deg) translateX(10px); }
        }

        /* Animasi 3: Pulse (Membesar Mengecil) */
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* Implementasi Gerak Bunga */
        .bunga-move-1 { animation: flowerFloat 6s infinite ease-in-out; }
        .bunga-move-2 { animation: flowerSway 8s infinite ease-in-out; }
        .bunga-move-3 { animation: flowerFloat 7s infinite ease-in-out reverse; }

        /* Penempatan Bunga */
        .ki-ta { z-index: 10; width: 50%; top: -2%; left: -5%; }
        .ka-ta { z-index: 10; width: 50%; top: -2%; right: -5%; }
        
        .ki-te { z-index: 10; width: 35%; top: 30%; left: 0; }
        .ka-te { z-index: 10; width: 35%; top: 30%; right: 0; }

        /* Bunga Bawah (Rimbun & Menutup Rumah) */
        .bunga-bawah { z-index: 15; width: 65%; bottom: -5%; }
        .ki-ba { left: -8%; }
        .ka-ba { right: -8%; }
        .aksen-ba { z-index: 16; width: 100%; bottom: 0; left: 0; }

        /* --- AREA TENGAH (LOGO & TOMBOL) --- */
        .center-area {
            position: absolute;
            z-index: 20;
            top: 40%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(-50%);
        }

        .logo-inisial {
            width: 60%;
            margin-bottom: 40px;
            animation: logoPulse 4s infinite ease-in-out;
        }

        .btn-buka {
            padding: 15px 45px;
            background-color: #8D6E63;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .btn-buka:hover { transform: scale(1.1); background-color: #6D4C41; }

        /* Section 2 (Isi Undangan) */
        .section-content {
            min-height: 100vh;
            background: #fff;
            padding: 50px 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <audio id="undanganAudio" src="musik_bg.mp3" loop></audio>

    <section class="section-cover">
        <div class="main-wrapper">
            
            <img src="file2_rumah_adat.png" class="layer rumah-adat">

            <img src="1000318798.png" class="layer gate-pilar gate-left">
            <img src="1000318798.png" class="layer gate-pilar gate-right">

            <img src="file4_bunga_kiri_atas.png" class="layer bunga-move-1 ki-ta">
            <img src="file5_bunga_kanan_atas.png" class="layer bunga-move-3 ka-ta">
            <img src="file6_bunga_kiri_tengah.png" class="layer bunga-move-2 ki-te">
            <img src="file7_bunga_kanan_tengah.png" class="layer bunga-move-2 ka-te">

            <div class="center-area">
                <img src="file12_logo_inisial.png" class="logo-inisial">
                <button class="btn-buka" onclick="bukaUndangan()">Buka Undangan</button>
            </div>

            <img src="file8_bunga_kiri_bawah.png" class="layer bunga-move-1 bunga-bawah ki-ba">
            <img src="file9_bunga_kanan_bawah.png" class="layer bunga-move-1 bunga-bawah ka-ba">
            <img src="file13_aksen_bawah.png" class="layer bunga-move-3 aksen-ba">

        </div>
    </section>

    <section id="konten" class="section-content">
        <h2>Selamat Datang di Undangan Kami</h2>
        <p>Isi konten selanjutnya di sini ya bep...</p>
    </section>

    <script>
        function bukaUndangan() {
            // Putar Musik
            var audio = document.getElementById("undanganAudio");
            audio.play().catch(function(error) {
                console.log("Autoplay dicegah browser, musik jalan setelah interaksi.");
            });

            // Scroll ke Konten
            document.getElementById('konten').scrollIntoView({ 
                behavior: 'smooth' 
            });
        }
    </script>
</body>
</html>
